<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICT · App Builds</title>
<style>
:root{
  --bg:#0b0e14; --panel:#111826; --panel2:#0e1420; --line:#1e2735;
  --ink:#f4f7fb; --muted:#9aa7b8; --muted2:#6f7d90;
  --teal:#2bd9ff; --teal-ink:#04202a; --red:#ff5a5f;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef2f7; --panel:#ffffff; --panel2:#f5f8fc; --line:#dce4ee;
  --ink:#0c1522; --muted:#55607a; --muted2:#8995a7;
  --teal:#007a96; --teal-ink:#ffffff; --red:#c7262e;
  color-scheme:light;
}}
*{box-sizing:border-box} html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; line-height:1.5;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left));
  background-image:radial-gradient(1100px 500px at 88% -8%,rgba(43,217,255,.10),transparent 60%),radial-gradient(900px 460px at -8% 4%,rgba(255,90,95,.06),transparent 55%);
  background-attachment:fixed;
}
.wrap{max-width:960px;margin:0 auto}
header.hero{padding:22px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--teal),#1aa6c2);display:grid;place-items:center;color:var(--teal-ink);font-weight:800;font-size:16px;letter-spacing:.02em;box-shadow:0 8px 22px -10px rgba(0,0,0,.5)}
h1{font-size:clamp(22px,4.5vw,30px);margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:7px 0 0}
.bar{display:flex;gap:10px;align-items:center;margin:18px 0 2px;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;outline:none}
.search svg{width:17px;height:17px;color:var(--muted2);flex:none}
.count{color:var(--muted2);font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:13px;box-shadow:0 1px 2px rgba(0,0,0,.25),0 22px 44px -28px rgba(0,0,0,.6)}
.top{display:flex;align-items:center;gap:12px}
.icon{width:48px;height:48px;border-radius:13px;flex:none;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--teal);font-weight:800;font-size:15px;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700;font-size:16.5px;margin:0;line-height:1.25}
.meta{color:var(--muted2);font-size:12px;margin:3px 0 0;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.code{font-weight:700;color:var(--teal);font-size:11px;letter-spacing:.03em;background:color-mix(in srgb,var(--teal) 16%,transparent);padding:2px 8px;border-radius:999px}
.pkg{font-family:ui-monospace,Menlo,monospace;font-size:11px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:13.5px;padding:11px 12px;border-radius:12px;transition:transform .1s,filter .1s}
.btn svg{width:16px;height:16px;flex:none}
.btn.dl{background:var(--teal);color:var(--teal-ink)}
.btn.dl:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn.art{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.art:hover{border-color:var(--teal);color:var(--teal)}
.btn.off{background:var(--panel2);color:var(--muted2);border:1px dashed var(--line);cursor:default;pointer-events:none}
.sz{font-weight:600;font-size:11.5px;opacity:.82}
.state{padding:48px 16px;text-align:center;color:var(--muted)}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted2);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">
      <div class="logo">ICT</div>
      <div>
        <h1>App Builds</h1>
        <p class="sub">Tải các bản build app của <b>ICT</b> — APK + bản xem trước (artifact) từng app.</p>
      </div>
    </div>
    <div class="bar">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="q" type="search" placeholder="Tìm theo tên app hoặc mã (vd 05j, Origami)…" autocomplete="off">
      </label>
      <span class="count" id="count"></span>
    </div>
  </header>

  <div id="list" class="grid" hidden></div>
  <div id="state" class="state"><div class="spinner"></div>Đang tải danh sách app…</div>

  <footer>Trang quản lý & tải bản build các app ICT. Chỉ phát hành file <b>.apk</b> (không có mã nguồn).</footer>
</div>

<script>
const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = b => !b ? "" : (b>=1<<30 ? (b/(1<<30)).toFixed(2)+" GB" : (b/(1<<20)).toFixed(0)+" MB");

function render(apps){
  const list=document.getElementById("list"), state=document.getElementById("state");
  if(!apps.length){ state.textContent="Chưa có app nào."; return; }
  state.hidden=true; list.hidden=false;
  list.innerHTML = apps.map(a=>{
    const dl = a.apk
      ? `<a class="btn dl" href="${esc(a.apk)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>Tải APK${a.size?` <span class="sz">· ${fmtSize(a.size)}</span>`:""}</a>`
      : `<span class="btn off">APK sắp có</span>`;
    const art = a.artifact
      ? `<a class="btn art" href="${esc(a.artifact)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>Xem artifact</a>`
      : "";
    return `<div class="card" data-s="${esc((a.name+' '+a.code+' '+(a.package||'')).toLowerCase())}">
      <div class="top">
        <div class="icon">${a.icon?`<img src="${esc(a.icon)}" alt="">`:esc(a.code.toUpperCase())}</div>
        <div style="min-width:0">
          <p class="name">${esc(a.name)}</p>
          <p class="meta"><span class="code">${esc(a.code)}</span>${a.package?`<span class="pkg">${esc(a.package)}</span>`:""}</p>
        </div>
      </div>
      <div class="btns">${dl}${art}</div>
    </div>`;
  }).join("");
  document.getElementById("count").textContent = apps.length + " app";
}

function applyFilter(){
  const q=document.getElementById("q").value.trim().toLowerCase(); let n=0;
  document.querySelectorAll(".card").forEach(c=>{const hit=!q||c.dataset.s.includes(q);c.style.display=hit?"":"none";if(hit)n++;});
  document.getElementById("count").textContent=n+" app";
}

(async()=>{
  let data={apps:[]};
  try{ const r=await fetch("apps.json",{cache:"no-store"}); if(r.ok) data=await r.json(); }
  catch(e){ document.getElementById("state").textContent="Không đọc được apps.json."; return; }
  const apps=(data.apps||[]).filter(a=>!a.hidden).sort((a,b)=>(a.order??999)-(b.order??999)||a.code.localeCompare(b.code));
  render(apps);
  document.getElementById("q").addEventListener("input",applyFilter);
})();
</script>
</body>
</html>
