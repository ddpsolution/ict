<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFC · Preview Builds</title>
<style>
:root{
  --bg:#0b0e14; --panel:#111826; --panel2:#0e1420; --line:#1e2735;
  --ink:#f4f7fb; --muted:#9aa7b8; --muted2:#6f7d90;
  --teal:#2bd9ff; --teal-ink:#04202a; --green:#36d399; --red:#ff5a5f;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef2f7; --panel:#ffffff; --panel2:#f5f8fc; --line:#dce4ee;
  --ink:#0c1522; --muted:#55607a; --muted2:#8995a7;
  --teal:#007a96; --teal-ink:#ffffff; --green:#14774c; --red:#c7262e;
  color-scheme:light;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; line-height:1.5;
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left));
  background-image:radial-gradient(1100px 500px at 88% -8%,rgba(43,217,255,.10),transparent 60%),radial-gradient(900px 460px at -8% 4%,rgba(255,90,95,.06),transparent 55%);
  background-attachment:fixed;
}
.wrap{max-width:960px;margin:0 auto}
header.hero{padding:22px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--teal),#1aa6c2);display:grid;place-items:center;color:var(--teal-ink);font-weight:800;font-size:15px;letter-spacing:.02em;box-shadow:0 8px 22px -10px rgba(0,0,0,.5)}
h1{font-size:clamp(22px,4.5vw,30px);margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:8px 0 0}
.bar{display:flex;gap:10px;align-items:center;margin:18px 0 6px;flex-wrap:wrap}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;outline:none}
.search svg{width:17px;height:17px;color:var(--muted2);flex:none}
.count{color:var(--muted2);font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 16px 15px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.25),0 22px 44px -28px rgba(0,0,0,.6)}
.top{display:flex;align-items:center;gap:12px}
.icon{width:46px;height:46px;border-radius:12px;flex:none;object-fit:cover;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--teal);font-weight:800;font-size:16px;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:cover}
.name{font-weight:700;font-size:16px;margin:0;line-height:1.25}
.meta{color:var(--muted);font-size:12.5px;margin:3px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code{font-weight:700;color:var(--teal);font-size:11.5px;letter-spacing:.03em;background:color-mix(in srgb,var(--teal) 16%,transparent);padding:2px 8px;border-radius:999px}
.notes{color:var(--muted);font-size:13px;margin:0;max-height:3.8em;overflow:hidden}
.dls{display:flex;flex-direction:column;gap:8px}
.dl{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;background:var(--teal);color:var(--teal-ink);font-weight:700;font-size:14px;padding:11px 15px;border-radius:12px;transition:transform .1s,filter .1s}
.dl:hover{transform:translateY(-1px);filter:brightness(1.05)}
.dl .r{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px;opacity:.85}
.dl svg{width:17px;height:17px;flex:none}
.state{padding:48px 16px;text-align:center;color:var(--muted)}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted2);font-size:12.5px;text-align:center}
footer b{color:var(--muted)}
a.link{color:var(--teal);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">
      <div class="logo">AFC</div>
      <div>
        <h1>Preview Builds</h1>
        <p class="sub">Bản build xem trước của các app — tải APK trực tiếp. Quản lý bởi <b>AFC</b>.</p>
      </div>
    </div>
    <div class="bar">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="q" type="search" placeholder="Tìm theo tên app hoặc mã (vd 05j, Live TV)…" autocomplete="off">
      </label>
      <span class="count" id="count"></span>
    </div>
  </header>

  <div id="list" class="grid" hidden></div>
  <div id="state" class="state"><div class="spinner"></div>Đang tải danh sách build…</div>

  <footer>
    Nguồn: GitHub Releases của <a class="link" href="https://github.com/ddpsolution/ict/releases" target="_blank" rel="noopener">ddpsolution/ict</a>.
    Mỗi lần AFC publish một release có APK, app sẽ tự xuất hiện ở đây.
    <br>Chỉ hiển thị file <b>.apk</b> — không có mã nguồn.
  </footer>
</div>

<script>
const REPO = "ddpsolution/ict";
const API = `https://api.github.com/repos/${REPO}/releases?per_page=100`;
const MANIFEST = "apps.json"; // tùy chọn: AFC tùy biến tên/icon/ẩn-hiện/thứ tự

const esc = s => (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize = b => b>=1<<30 ? (b/(1<<30)).toFixed(2)+" GB" : (b/(1<<20)).toFixed(1)+" MB";
const fmtDate = s => { try { return new Date(s).toLocaleDateString('vi-VN',{year:'numeric',month:'2-digit',day:'2-digit'}); } catch { return ""; } };

// Tách mã app 3 ký tự (vd 05j) từ tag/tên.
function appCode(rel){
  const m = (rel.tag_name||"").match(/^([0-9a-z]{3})\b/i) || (rel.name||"").match(/\(([0-9a-z]{3})\)/i) || (rel.name||"").match(/\b([0-9]{2}[a-z0-9])\b/i);
  return m ? m[1].toLowerCase() : "";
}
// Tên app sạch từ release name.
function appName(rel, code){
  let n = rel.name || rel.tag_name || "";
  n = n.split("—")[0].split(" - ")[0];
  if (code) n = n.replace(new RegExp("\\(?\\b"+code+"\\b\\)?","ig"),"");
  n = n.replace(/\b(preview|debug|light|redesign)\b/ig,"").replace(/\s+v?\d+(\.\d+){1,3}\b/ig,"");
  n = n.replace(/[·\-–|]+\s*$/,"").replace(/\s{2,}/g," ").trim();
  return n || (rel.tag_name||"App");
}

function render(rows){
  const list = document.getElementById("list");
  const state = document.getElementById("state");
  if (!rows.length){ state.textContent = "Chưa có build APK nào."; state.hidden=false; list.hidden=true; return; }
  state.hidden = true; list.hidden = false;
  list.innerHTML = rows.map(r => `
    <div class="card" data-s="${esc((r.name+' '+r.code+' '+r.tag).toLowerCase())}">
      <div class="top">
        <div class="icon">${r.icon ? `<img src="${esc(r.icon)}" alt="">` : esc((r.code||r.name||'?').slice(0,3).toUpperCase())}</div>
        <div style="min-width:0">
          <p class="name">${esc(r.name)}</p>
          <p class="meta">${r.code?`<span class="code">${esc(r.code)}</span>`:""}<span>${esc(r.tag)}</span><span>·</span><span>${fmtDate(r.date)}</span></p>
        </div>
      </div>
      ${r.notes?`<p class="notes">${esc(r.notes)}</p>`:""}
      <div class="dls">
        ${r.apks.map(a=>`<a class="dl" href="${esc(a.url)}" target="_blank" rel="noopener">
          <span style="display:flex;align-items:center;gap:9px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>Tải APK</span>
          <span class="r">${fmtSize(a.size)}</span>
        </a>`).join("")}
      </div>
    </div>`).join("");
  document.getElementById("count").textContent = rows.length + " app";
}

function applyFilter(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".card").forEach(c=>{
    const hit = !q || c.dataset.s.includes(q);
    c.style.display = hit ? "" : "none"; if(hit) shown++;
  });
  document.getElementById("count").textContent = shown + " app";
}

async function load(){
  let manifest = {};
  try { const m = await fetch(MANIFEST,{cache:"no-store"}); if(m.ok) manifest = await m.json(); } catch {}
  const over = manifest.apps || {};            // { "05j": {name, icon, notes, hidden, order} }
  let releases = [];
  try {
    const res = await fetch(API,{headers:{Accept:"application/vnd.github+json"}});
    if(!res.ok) throw new Error("HTTP "+res.status);
    releases = await res.json();
  } catch(e){
    document.getElementById("state").innerHTML = "Không tải được danh sách (GitHub API). Thử lại sau.<br><small>"+esc(e.message)+"</small>";
    return;
  }
  const rows = [];
  for (const rel of releases){
    if (rel.draft) continue;
    const apks = (rel.assets||[]).filter(a=>/\.apk$/i.test(a.name))
      .map(a=>({url:a.browser_download_url, size:a.size, name:a.name}));
    if (!apks.length) continue;
    const code = appCode(rel);
    const o = over[code] || {};
    if (o.hidden) continue;
    rows.push({
      code, tag: rel.tag_name, date: rel.published_at||rel.created_at,
      name: o.name || appName(rel, code),
      icon: o.icon || null,
      notes: o.notes!==undefined ? o.notes : (rel.body||"").split("\n")[0].slice(0,160),
      order: o.order, apks,
    });
  }
  rows.sort((a,b)=>{
    if (a.order!=null || b.order!=null) return (a.order??999)-(b.order??999);
    return new Date(b.date)-new Date(a.date);
  });
  render(rows);
  document.getElementById("q").addEventListener("input", applyFilter);
}
load();
</script>
</body>
</html>
